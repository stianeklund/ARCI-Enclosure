<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer>
        <feFuncR type="linear" slope="2.4" intercept="0.04"/>
        <feFuncG type="linear" slope="2.4" intercept="0.04"/>
        <feFuncB type="linear" slope="2.4" intercept="0.04"/>
      </feComponentTransfer>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffb000"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, sans-serif; fill: #f7f9fc; }
      .sub { font: 16px system-ui, sans-serif; fill: #b9c4d4; }
      .label { font: 700 19px system-ui, sans-serif; fill: #f7f9fc; }
      .desc { font: 15px system-ui, sans-serif; fill: #cad3df; }
      .arrow { stroke: #ffb000; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .num { font: 700 17px system-ui, sans-serif; fill: #1f2630; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect width="1200" height="820" fill="#252d39"/>
  <text class="title" x="36" y="43">Original front half — internal support geometry</text>
  <text class="sub" x="36" y="70">Interior view from Radio Enclosure Front - Proto v66 (shown in its stored orientation)</text>
  <rect x="34" y="90" width="430" height="700" rx="18" fill="#303947" stroke="#566273"/>
  <g clip-path="url(#modelClip)">
    <image href="original-front-interior-back.png" x="-945" y="10" width="1600" height="1000" filter="url(#lift)"/>
  </g>
  <defs>
    <clipPath id="modelClip"><rect x="35" y="91" width="428" height="698" rx="17"/></clipPath>
  </defs>

  <rect x="488" y="91" width="676" height="698" rx="18" fill="#1e2530" stroke="#566273"/>

  <circle cx="506" cy="137" r="16" fill="#ffb000"/><text class="num" x="506" y="138">1</text>
  <text class="label" x="536" y="132">Perimeter mating lip and enclosure wall</text>
  <text class="desc" x="536" y="156">Locates the back half, controls the seam, and stiffens the panel.</text>
  <path class="arrow" d="M505 166 C455 175, 435 155, 399 119"/>

  <circle cx="506" cy="238" r="16" fill="#ffb000"/><text class="num" x="506" y="239">2</text>
  <text class="label" x="536" y="233">Rear collars around rotary controls</text>
  <text class="desc" x="536" y="257">Thick sleeves support encoders/pots and distribute tightening loads.</text>
  <path class="arrow" d="M505 268 C450 270, 420 245, 353 205"/>

  <circle cx="506" cy="339" r="16" fill="#ffb000"/><text class="num" x="506" y="340">3</text>
  <text class="label" x="536" y="334">Rectangular push-button guide tunnels</text>
  <text class="desc" x="536" y="358">Keep caps aligned, resist side load, and reduce button wobble.</text>
  <path class="arrow" d="M505 369 C430 380, 340 345, 174 228"/>

  <circle cx="506" cy="440" r="16" fill="#ffb000"/><text class="num" x="506" y="441">4</text>
  <text class="label" x="536" y="435">Cylindrical mounting bosses / standoffs</text>
  <text class="desc" x="536" y="459">Raised screw seats for the display, PCBs, and internal assemblies.</text>
  <path class="arrow" d="M505 470 C455 475, 400 430, 326 293"/>

  <circle cx="506" cy="541" r="16" fill="#ffb000"/><text class="num" x="506" y="542">5</text>
  <text class="label" x="536" y="536">Display support frame and mounting zone</text>
  <text class="desc" x="536" y="560">A recessed shoulder plus local supports establishes LCD depth and alignment.</text>
  <path class="arrow" d="M505 571 C430 570, 365 520, 276 424"/>

  <circle cx="506" cy="642" r="16" fill="#ffb000"/><text class="num" x="506" y="643">6</text>
  <text class="label" x="536" y="637">Local pads, screw seats, and edge reinforcements</text>
  <text class="desc" x="536" y="661">Small features support assemblies locally without thickening the whole shell.</text>
  <path class="arrow" d="M505 672 C430 680, 350 705, 209 737"/>

  <rect x="516" y="709" width="610" height="50" rx="10" fill="#2c3542"/>
  <text class="desc" x="536" y="730">The original relies mostly on localized bosses, collars, and guides—not a dense rib grid.</text>
  <text class="desc" x="536" y="750">That is the right general strategy for a 3D-printed electronics enclosure.</text>
</svg>
